services:

  # ─── Database ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: neobus_postgres
    restart: always
    environment:
      POSTGRES_USER: neobus
      POSTGRES_PASSWORD: neobus
      POSTGRES_DB: neobus_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neobus -d neobus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── App (Frontend + Backend in one container) ─────────────
  app:
    # Built from this repository rather than pulled from a registry, so the running
    # container always matches the source you are looking at.
    build:
      context: ./Neo_bus
      dockerfile: ../Dockerfile
    image: neobus-app:latest
    container_name: neobus_app
    restart: always
    ports:
      - "3000:80"
    environment:
      - DATABASE_URL=postgresql://neobus:neobus@db:5432/neobus_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in a .env file next to docker-compose.yml}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:?Set JWT_REFRESH_SECRET_KEY in a .env file next to docker-compose.yml}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
